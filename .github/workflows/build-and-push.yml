name: Build and Push to GHCR

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server-api
            context: ./backend
            dockerfile: ./backend/cmd/api/Dockerfile
            build_args: SERVER_PORT=8080
          - name: server-schedule-engine
            context: ./backend
            dockerfile: ./backend/cmd/schedule_engine/Dockerfile
            build_args: SERVER_PORT=8081
          - name: server-device-gateway
            context: ./backend
            dockerfile: ./backend/cmd/device_gateway/Dockerfile
            build_args: SERVER_PORT=8090
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            build_args: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Registry Owner
        id: owner
        run: echo "LOWER_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ env.LOWER_OWNER }}/${{ matrix.name }}:latest