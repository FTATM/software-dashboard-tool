server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=1m;

    # 1. Route API requests to the Go backend
    location /api/ {
        set $api_upstream http://server-api:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $api_upstream;

        # Standard identity & host headers
        proxy_set_header Host $host;

        # ⚡ Client IP tracking for Go audit logging
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚡ Performance: Keep connections alive between Nginx and Go
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 2. Serve the Vue frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}