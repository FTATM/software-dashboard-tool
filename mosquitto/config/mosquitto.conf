# Listen on all network interfaces on port 1883
listener 1883 0.0.0.0

# Allow devices to connect without a password (Set to false in production!)
allow_anonymous true

# Save messages to disk so they aren't lost if the broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
# log_dest file /mosquitto/log/mosquitto.log
log_dest stdout